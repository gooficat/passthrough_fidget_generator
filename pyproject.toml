[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passthrough-fidget-generator"
version = "0.1.3"
description = "Generate interlocking passthrough fidgets from existing 3D models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Hasan Sabri" }
]

dependencies = [
    "numpy",
    "trimesh",
    "manifold3d",
    "networkx",
]

[project.scripts]
passthrough-fidget-generator = "passthrough_fidget_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
